name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # reads version from packageManager

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - name: Vitest (junit + console)
        run: pnpm --filter @nyworkflow/web test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Artefact — UI construite (dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Artefact — rapport Vitest
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: apps/web/test-results
          if-no-files-found: warn

  e2e:
    name: Playwright (UI web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nyworkflow/web exec playwright install --with-deps chromium

      - run: pnpm --filter @nyworkflow/web test:e2e

      - name: Artefact — rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
