name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # relance manuelle possible (onglet Actions)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # reads version from packageManager

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - name: Vitest (junit + console)
        run: pnpm -r --if-present test:ci

      - name: Artefact — UI construite (dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Artefact — rapports Vitest
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: |
            apps/web/test-results
            packages/adapter-llm/test-results
            packages/core/test-results
            packages/session/test-results
            packages/tools/test-results
          if-no-files-found: warn

  e2e:
    name: Playwright (UI web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nyworkflow/web exec playwright install --with-deps chromium

      - run: pnpm --filter @nyworkflow/web test:e2e

      - name: Artefact — rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn

  screenshot:
    name: Capture README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build # dist nécessaire au serveur preview

      - run: pnpm --filter @nyworkflow/web exec playwright install --with-deps chromium

      - name: Jouer la scène et capturer l'UI
        run: pnpm --filter @nyworkflow/web screenshot

      - name: Artefact — capture
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: docs/assets/screenshot.png
          if-no-files-found: error

      - name: Actualiser la capture du README (main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshot.png
          if git diff --cached --quiet; then
            echo "Capture inchangée — rien à pousser."
            exit 0
          fi
          git commit -m "chore: actualise la capture du README [skip ci]"
          git push
